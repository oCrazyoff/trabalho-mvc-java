services:

  mysql:
    image: mysql:8.4
    container_name: mvc-java-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mvc_java
      MYSQL_USER: mvc_user
      MYSQL_PASSWORD: mvc123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    image: tomcat:10.1-jdk21
    container_name: mvc-java-backend
    ports:
      - "8081:8080"
    volumes:
      - ./backend/deploy:/usr/local/tomcat/webapps
    depends_on:
      - mysql

  front:
    image: tomcat:10.1-jdk21
    container_name: mvc-java-front
    ports:
      - "8080:8080"
    volumes:
      - ./front/deploy:/usr/local/tomcat/webapps
    depends_on:
      - mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mvc-java-phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql

volumes:
  mysql_data:
