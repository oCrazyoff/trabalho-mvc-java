services:

  mysql:
    image: mysql:8.4
    container_name: mvc-java-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mvc_java
      MYSQL_USER: mvc_user
      MYSQL_PASSWORD: mvc123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mvc-network

  # API REST (por enquanto, cópia idêntica do monolito)
  backend:
    image: tomcat:10.1-jdk21
    container_name: mvc-java-backend
    environment:
      JWT_SECRET: K9vR2mX8pL4qT7wN3zH6bC1jF5sD0aY8
    ports:
      - "8082:8080"
    volumes:
      - ./backend/deploy:/usr/local/tomcat/webapps
    depends_on:
      - mysql
    networks:
      - mvc-network

  # Interface web (por enquanto, cópia idêntica do monolito)
  frontend:
    image: tomcat:10.1-jdk21
    container_name: mvc-java-frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/deploy:/usr/local/tomcat/webapps
    environment:
      # Endereço do backend dentro da rede Docker, para uso futuro
      BACKEND_URL: http://backend:8080/mvc
    depends_on:
      - backend
    networks:
      - mvc-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mvc-java-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - mvc-network

networks:
  mvc-network:
    driver: bridge

volumes:
  mysql_data:
